<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local API Mock</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="header-content">
        <div class="header-left">
          <h1 class="app-title">
            <img class="logo" src="icons/icon.svg" alt="">
            <span class="version-name" id="version-name" aria-label="Version"></span>
            API Mock
          </h1>
          <p class="header-subtitle">Local request interception & response mocking</p>
        </div>
        <nav class="top-nav" aria-label="Primary navigation">
          <span class="top-nav-active">Build</span>
          <span>Mocks</span>
          <span>History</span>
          <span>Settings</span>
        </nav>
        <div class="header-right">
          <div class="toggle-container">
            <label class="switch">
              <input id="enabled" type="checkbox">
              <span class="slider"></span>
            </label>
            <span class="toggle-label" id="toggle-status">Inactive</span>
          </div>
        </div>
      </div>
      <div class="header-info">
        <p class="info-text">Rules are stored locally in your browser. No data is sent to external services.</p>
      </div>
    </header>

    <main class="app-main">
      <div class="rules-container">
        <div class="rules-header">
          <div class="workspace-tabs" role="tablist" aria-label="Workspace views">
            <span class="workspace-tab active" role="tab" aria-selected="true">Collections</span>
            <span class="workspace-tab" role="tab" aria-selected="false">Environments</span>
          </div>
          <button id="add" class="btn btn-primary btn-add" type="button">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            New request
          </button>
        </div>
        <section id="rules" class="rules-list"></section>
        <input id="import-file" type="file" accept="application/json,.json" hidden>
      </div>
    </main>

    <footer class="app-footer">
      <div class="footer-content">
        <p class="footer-text">
          <a href="https://www.gnu.org/licenses/agpl-3.0.en.html" target="_blank" rel="noopener noreferrer">AGPL-3.0 License</a>
          <span class="separator">•</span>
          <span>Open source. Source code required when distributed.</span>
        </p>
      </div>
    </footer>
  </div>

  <script src="options-utils.js"></script>
  <script src="options.js"></script>
</body>
</html>
